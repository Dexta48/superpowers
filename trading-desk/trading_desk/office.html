<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading desk — the office</title>
<style>
:root{
  --bg:#f3f0ea; --wall:#e7e2d8; --floor:#d9d2c4; --card:#fffdf9; --ink:#22201c; --muted:#6f695e;
  --line:#cfc7b8; --screen:#11161c; --screen-ink:#b9f3c9; --news:#2f6fb3; --signal:#b9770e; --risk:#a23b3b;
  --up:#1d7a46; --down:#b23a3a; --flat:#6f695e; --desk:#b08d5e; --desk-edge:#8a6c44;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#15171a; --wall:#1c1f24; --floor:#22262c; --card:#1f2329; --ink:#e9e6df; --muted:#9a968c;
  --line:#343a43; --screen:#0a0d11; --news:#6aa9e9; --signal:#e3a94a; --risk:#e07a7a;
  --up:#56c98a; --down:#ef7f7f; --flat:#9a968c; --desk:#7a6242; --desk-edge:#5b4830;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.01em}
.badge{font-size:11px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:99px;background:var(--signal);color:#fff}
#status{color:var(--muted);font-size:13px;flex:1;min-width:160px}
button{font:inherit;font-weight:600;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.wall{background:var(--wall);padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;border-bottom:6px solid var(--desk-edge)}
.tick{background:var(--screen);color:#e8ecef;border-radius:8px;padding:8px 14px;min-width:120px;font-variant-numeric:tabular-nums}
.tick b{display:block;font-size:11px;letter-spacing:.1em;color:#8b98a5}
.tick span{font-size:18px;font-weight:600}
.tick i{font-style:normal;font-size:12px;margin-left:6px}
.floor{background:var(--floor);padding:22px 16px 26px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px}
.desk{position:relative;min-width:0}
.desk:not(:last-child)::after{content:"→";position:absolute;right:-27px;top:118px;font-size:22px;color:var(--muted)}
.desk.done:not(:last-child)::after{color:var(--c)}
.who{display:flex;align-items:flex-end;gap:10px;height:74px}
.avatar{width:56px;height:70px;flex:none}
.avatar .head{fill:var(--c)} .avatar .body{fill:var(--c);opacity:.75}
.working .avatar{animation:bob .9s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.bubble{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px 12px 12px 2px;padding:6px 10px;font-size:12.5px;font-style:italic;color:var(--muted);height:62px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.bubble:empty{visibility:hidden}
.monitor{background:var(--screen);color:var(--screen-ink);border-radius:10px 10px 0 0;border:5px solid #2b3138;border-bottom-width:9px;height:190px;padding:8px 10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.working .monitor span::after{content:"▍";animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.top{background:var(--desk);border-bottom:5px solid var(--desk-edge);border-radius:3px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.lamp{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.working .lamp{background:#f2c230;box-shadow:0 0 8px #f2c230}
.done .lamp{background:var(--up)} .error .lamp{background:var(--down)}
.plate{font-weight:700;color:#fff;text-shadow:0 1px 1px #0005}
.doing{margin-left:auto;font-size:12px;color:#fff;opacity:.9;text-align:right}
.log{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px;color:var(--muted);min-height:38px}
.log li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary{font-size:13px;font-weight:600;margin-top:4px}
@media (prefers-reduced-motion: reduce){.working .avatar,.working .monitor span::after{animation:none}}
main{padding:18px 16px 40px;max-width:1200px;margin:0 auto}
h2{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.err{background:var(--down);color:#fff;padding:8px 12px;border-radius:8px;margin-bottom:12px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.sig{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--d);border-radius:10px;padding:12px 14px}
.sig h3{margin:0 0 4px;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.dir{color:var(--d);font-weight:700}
.stamp{margin-left:auto;font-size:12px;font-weight:700;border:2px solid currentColor;border-radius:6px;padding:1px 7px;transform:rotate(-2deg)}
.sig p{margin:4px 0;font-size:13.5px}
.lv{font-variant-numeric:tabular-nums}
.note,pre.brief{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0}
pre.brief{white-space:pre-wrap;font:inherit;font-size:14px}
.empty{color:var(--muted)}
footer{color:var(--muted);font-size:12px;margin-top:24px}
@media (max-width:820px){.floor{grid-template-columns:1fr;gap:26px}.desk:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-27px}}
</style>
</head>
<body>
<header>
  <h1>Trading desk</h1><span class="badge" id="demo" hidden>DEMO</span>
  <div id="status">connecting…</div>
  <button id="run">Run now</button>
</header>
<section class="wall" id="wall" aria-label="Prices"></section>
<section class="floor" id="floor" aria-label="Agents"></section>
<main>
  <div class="err" id="err" hidden></div>
  <h2>Signal board</h2>
  <div class="board" id="board"><p class="empty">Nothing on the board yet — the desks are still working.</p></div>
  <h2>Combined exposure</h2><p class="note empty" id="port">—</p>
  <h2>News briefing</h2><pre class="brief empty" id="brief">—</pre>
  <footer>Analysis generated by an AI model from delayed data. Not financial advice. This page only talks to the program running on your own machine.</footer>
</main>
<script>
const DESKS=[["news","News desk","var(--news)","waiting for the next run"],
             ["signal","Signal desk","var(--signal)","waiting for the news briefing"],
             ["risk","Risk desk","var(--risk)","waiting for signals to review"]];
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const SVG='<svg class="avatar" viewBox="0 0 56 70" aria-hidden="true"><circle class="head" cx="28" cy="20" r="14"/><path class="body" d="M6 70c0-18 10-28 22-28s22 10 22 28z"/></svg>';
const ui={};
for(const [id,name,color,idle] of DESKS){
  const d=el("div","desk");d.style.setProperty("--c",color);
  const who=el("div","who");who.innerHTML=SVG;const bubble=el("div","bubble");who.append(bubble);
  const mon=el("div","monitor");const txt=el("span");mon.append(txt);
  const top=el("div","top");top.style.background=color;
  const doing=el("span","doing");top.append(el("span","lamp"),el("span","plate",name),doing);
  const summary=el("div","summary"),log=el("ul","log");
  d.append(who,mon,top,summary,log);$("floor").append(d);
  ui[id]={d,bubble,txt,doing,summary,log,idle};
}
const fmt=n=>n==null?"—":n.toLocaleString(undefined,{maximumFractionDigits:2});
function render(s){
  $("demo").hidden=!s.demo;
  const busy=s.phase!=="idle";
  $("run").disabled=busy;
  let st=busy?`Run ${s.run} in progress — ${s.phase==="data"?"loading charts":s.phase+" desk working"}`
             :s.run?`Run ${s.run} finished · started ${s.started}`:"Idle";
  if(!busy&&s.next_run_at)st+=` · next run ${new Date(s.next_run_at*1000).toLocaleTimeString()}`;
  $("status").textContent=st;
  $("err").hidden=!s.error;$("err").textContent=s.error?"Run failed: "+s.error:"";
  $("wall").replaceChildren(...s.tickers.map(t=>{
    const e=el("div","tick");e.append(el("b",null,t.symbol),el("span","",fmt(t.last)));
    if(t.chg!=null){const i=el("i",null,(t.chg>=0?"+":"")+t.chg+"%");i.style.color=t.chg>=0?"#56c98a":"#ef7f7f";e.append(i)}
    return e}));
  for(const [id] of DESKS){
    const k=s.desks[id],u=ui[id];
    u.d.className="desk "+k.status;
    u.bubble.textContent=k.status==="working"?k.thought:"";
    u.txt.textContent=k.screen||(k.status==="idle"?"":"");
    u.doing.textContent=k.status==="working"?k.doing:k.status==="idle"?u.idle:k.status;
    u.summary.textContent=k.summary;
    u.log.replaceChildren(...k.log.map(l=>el("li",null,l)));
  }
  if(s.board.length){
    $("board").replaceChildren(...s.board.map(b=>{
      const c=el("div","sig");
      c.style.setProperty("--d",b.direction==="long"?"var(--up)":b.direction==="short"?"var(--down)":"var(--flat)");
      const h=el("h3");h.append(el("span",null,b.symbol),el("span","dir",b.direction.toUpperCase()));
      if(b.verdict){const v=el("span","stamp",b.verdict+(b.score!=null?` · ${b.score}/10`:""));
        v.style.color=b.verdict.startsWith("TAKE")?"var(--up)":b.verdict==="REJECT"?"var(--down)":"var(--signal)";h.append(v)}
      c.append(h);
      if(b.direction!=="flat"){
        c.append(el("p",null,`${b.setup} (${b.confidence} confidence)`));
        c.append(el("p","lv",`Entry ${fmt(b.entry)} · Stop ${fmt(b.stop)} · Targets ${b.targets.map((t,i)=>fmt(t)+(b.rr[i]!=null?` (${b.rr[i]}R)`:"")).join(", ")}`));
        c.append(el("p","lv",`Risk $${fmt(b.risk_usd)} per contract · up to ${b.contracts} contract(s) in budget`));
      }
      if(b.weakness)c.append(el("p",null,"Risk desk: "+b.weakness));
      if(b.adjust)c.append(el("p",null,"Adjust: "+b.adjust));
      return c}));
  }else if(busy){$("board").replaceChildren(el("p","empty","Nothing on the board yet — the desks are still working."))}
  const set=(id,t)=>{$(id).textContent=t||"—";$(id).classList.toggle("empty",!t)};
  set("port",[s.market_context,s.portfolio_note].filter(Boolean).join(" "));set("brief",s.briefing);
}
async function poll(){
  try{render(await (await fetch("/state")).json())}
  catch(e){$("status").textContent="Office closed — the program is not running."}
  setTimeout(poll,600);
}
$("run").onclick=()=>{$("run").disabled=true;fetch("/run",{method:"POST"})};
poll();
</script>
</body>
</html>
